# Nginx: tashqi so'rovlarni ilovaga uzatadi. server_name ni domeningizga almashtiring.
server {
    listen 80;
    listen [::]:80;
    server_name DOMEN_YOKI_IP;

    client_max_body_size 50M;   # nizom PDF va sertifikat fonlari uchun

    location /static/ {
        alias /opt/olimpiada/app/web/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # katta Excel/ZIP eksport uchun
    }
}
